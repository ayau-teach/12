<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жаңбыр суын тазалау макеті 3D</title>
<style>
:root{--b1:#cfe9f7;--b2:#f4fafd;--fg:#12304a;--card:rgba(255,255,255,.9);--ac:#1c7ed6;--ln:rgba(18,48,74,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#0c1d2c;--b2:#1b3549;--fg:#e8f2fa;--card:rgba(16,34,50,.9);--ac:#6bb6f5;--ln:rgba(232,242,250,.22)}}
:root[data-theme="dark"]{--b1:#0c1d2c;--b2:#1b3549;--fg:#e8f2fa;--card:rgba(16,34,50,.9);--ac:#6bb6f5;--ln:rgba(232,242,250,.22)}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--b1),var(--b2));color:var(--fg);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;overflow:hidden;background-color:var(--b2)}
#v{position:fixed;inset:0}canvas{display:block;touch-action:none}
header{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none}
h1{font:700 19px/1.2 Georgia,serif;margin:0}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
#bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:0 12px;overflow-x:auto}
button{flex:none;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:9px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.l{position:fixed;left:0;top:0;font-size:11.5px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:2px 6px;pointer-events:none;white-space:nowrap}
#note{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:12.5px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;max-width:420px}
</style></head><body>
<div id="v"></div>
<header><h1>Жаңбыр суын жинап тазалау макеті</h1><p>Бір саусақпен айналдыр, екі саусақпен жақында</p></header>
<div id="note"><b>Сүзгі қабаттары (жоғарыдан төмен):</b> ірі тас → ұсақ тас → құм → көмір → дәке. Су ірі қабаттан майдаға қарай өтеді.</div>
<div id="bar">
<button data-v="all">Толық</button><button data-v="front">Алдынан</button><button data-v="top">Үстінен</button><button data-v="filter">Сүзгі</button>
<button id="rain" aria-pressed="true">Жаңбыр</button><button id="lab" aria-pressed="true">Белгілер</button><button id="auto" aria-pressed="true">Автоайналу</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S=new THREE.Scene(),Cm=new THREE.PerspectiveCamera(45,1,1,700),R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));const cv=R.domElement;document.getElementById('v').appendChild(cv);
S.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.95));
const DL=new THREE.DirectionalLight(0xffffff,.8);DL.position.set(60,110,90);S.add(DL);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
const B=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);S.add(o);return o};
const C=(rt,rb,h,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,32),m);o.position.set(x,y,z);S.add(o);return o};
const card=M(0xc9955a),glass={transparent:true,opacity:.22,roughness:.1,side:THREE.DoubleSide};
// table + house
B(130,2,100,M(0xe3d5b4),14,-1,8);
B(25,26,32,M(0xb98349),12.5,13,0);
const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(25,0);sh.lineTo(25,14);sh.lineTo(0,26);
[-16,15].forEach(z=>{const w=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:1,bevelEnabled:false}),card);w.position.set(0,26,z);S.add(w)});
const a=Math.atan(12/25),roof=B(30,.8,34,M(0xa85a3a),12.5,46,0);roof.rotation.z=-a;
// gutter
const foil=M(0xc7ced4,{metalness:.5,roughness:.35});
B(5,.4,40,foil,27,38.6,4);B(.4,2,40,foil,24.6,39.4,4);B(.4,2,40,foil,29.4,39.4,4);B(5,2,.4,foil,27,39.4,-16);
// stand + jar + filter
const fx=27,fz=24;
B(14,1,14,card,fx,12.5,fz);B(1,12,14,card,fx-6.5,6,fz);B(1,12,14,card,fx+6.5,6,fz);
C(5,5,11,M(0xffffff,glass),fx,5.5,fz);
const cw=C(4.7,4.7,6,M(0x7fd0f0,{transparent:true,opacity:.75}),fx,.2,fz);cw.geometry.translate(0,3,0);cw.position.y=.2;
C(1.7,1.7,1.2,M(0x2b6cb0),fx,12,fz);
const cone=C(4.5,1.5,5,M(0xffffff,glass),fx,15.5,fz),body=C(4.5,4.5,19,M(0xffffff,glass),fx,27.5,fz);
// layers bottom->top (neck first): дәке, көмір, құм, ұсақ тас, ірі тас
const LY=[["Дәке",1,0xf4f4f0,3.5],["Көмір",4,0x1d1f22,4],["Құм",5,0xe0c48a,4],["Ұсақ тас",4,0x9a8f80,4],["Ірі тас",4,0x6f747a,4]];
let y=17;const labs=[];
LY.forEach(([n,h,c,r])=>{C(r,r,h,M(c,{roughness:1}),fx,y+h/2,fz);labs.push([n+" "+h+" см",new THREE.Vector3(fx+6.2,y+h/2,fz)]);y+=h});
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<16;i++){const g=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,8),M(0x80858b));const q=rnd()*6.28,d=rnd()*2.8;g.position.set(fx+Math.cos(q)*d,31+rnd()*3.2,fz+Math.sin(q)*d);S.add(g)}
labs.push(["Төбе",new THREE.Vector3(10,50,0)],["Науа",new THREE.Vector3(27,41.5,-9)],["Тіреуіш",new THREE.Vector3(fx-8,6,fz)],["Таза су",new THREE.Vector3(fx,3,fz+6)],["Қақпақ (4–5 тесік)",new THREE.Vector3(fx-4,11.5,fz+3)]);
const LE=labs.map(([t])=>{const d=document.createElement('div');d.className='l';d.textContent=t;document.body.appendChild(d);return d});
// rain
const N=170,pa=new Float32Array(N*3),yr=x=>52.4-.48*x;
const rs=i=>{pa[i*3]=Math.random()*26;pa[i*3+1]=yr(pa[i*3])+Math.random()*60;pa[i*3+2]=-16+Math.random()*32};
for(let i=0;i<N;i++)rs(i);
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(pa,3));
const rp=new THREE.Points(rg,new THREE.PointsMaterial({color:0x3b8fe0,size:1,sizeAttenuation:true}));rp.frustumCulled=false;S.add(rp);
const DR=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.7,8,8),M(0x3b8fe0));S.add(m);DR.push({m,t:i/14*2.4})}
// camera
const V={th:.6,ph:1.15,r:150,tx:14,ty:28,tz:6};let goal=null,auto=true,rainOn=true,wl=.05;
const VW={all:{th:.6,ph:1.15,r:150,tx:14,ty:28,tz:6},front:{th:0,ph:1.4,r:140,tx:14,ty:28,tz:6},top:{th:.01,ph:.25,r:150,tx:14,ty:28,tz:6},filter:{th:.9,ph:1.3,r:62,tx:27,ty:24,tz:24}};
const P=new Map();let pd=0;const pinch=()=>{if(P.size<2)return 0;const[p,q]=[...P.values()];return Math.hypot(p[0]-q[0],p[1]-q[1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);goal=null;setA(false);pd=pinch()});
cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
if(P.size==1){V.th-=(e.clientX-o[0])*.008;V.ph=Math.min(1.5,Math.max(.12,V.ph-(e.clientY-o[1])*.008))}
else{const d=pinch();if(d&&pd)V.r=Math.min(280,Math.max(35,V.r*pd/d));pd=d}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>P.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();V.r=Math.min(280,Math.max(35,V.r*(1+e.deltaY*.001)))},{passive:false});
const $=id=>document.getElementById(id);
function setA(v){auto=v;$('auto').setAttribute('aria-pressed',v)}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{goal=VW[b.dataset.v];setA(false)});
$('rain').onclick=e=>{rainOn=!rainOn;e.target.setAttribute('aria-pressed',rainOn);rp.visible=rainOn};
let labOn=true;$('lab').onclick=e=>{labOn=!labOn;e.target.setAttribute('aria-pressed',labOn)};
$('auto').onclick=()=>{setA(!auto);goal=null};
function rs2(){R.setSize(innerWidth,innerHeight);Cm.aspect=innerWidth/innerHeight;Cm.updateProjectionMatrix()}
addEventListener('resize',rs2);rs2();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)setA(false);
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(auto)V.th+=dt*.25;
if(goal){const k=Math.min(1,dt*4);for(const p in goal)V[p]+=(goal[p]-V[p])*k}
Cm.position.set(V.tx+V.r*Math.sin(V.ph)*Math.sin(V.th),V.ty+V.r*Math.cos(V.ph),V.tz+V.r*Math.sin(V.ph)*Math.cos(V.th));Cm.lookAt(V.tx,V.ty,V.tz);
if(rainOn&&!reduce){
for(let i=0;i<N;i++){pa[i*3+1]-=50*dt;if(pa[i*3+1]<yr(pa[i*3]))rs(i)}rg.attributes.position.needsUpdate=true;
DR.forEach(d=>{d.t=(d.t+dt*.55)%2.4;const t=d.t,m=d.m;m.visible=true;
if(t<1)m.position.set(27,39,-16+40*t);
else if(t<1.5){const u=(t-1)/.5;m.position.set(27,39-u*u*20,24)}
else if(t<2){m.visible=false}
else{const u=(t-2)/.4;m.position.set(27,11-u*7,24)}});
wl+=dt*.012;if(wl>1)wl=.05;cw.scale.y=wl}
else DR.forEach(d=>d.m.visible=false);
labs.forEach(([,p],i)=>{const v=p.clone().project(Cm),e=LE[i];e.style.display=(labOn&&v.z<1)?'block':'none';
e.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-50%)`});
R.render(S,Cm)}
requestAnimationFrame(loop);
</script></body></html>
